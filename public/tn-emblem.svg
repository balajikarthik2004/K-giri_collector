<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Government of Tamil Nadu emblem">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DFA0" />
      <stop offset="1" stop-color="#D8B75A" />
    </linearGradient>
  </defs>

  <!-- Seal ring -->
  <circle cx="48" cy="48" r="46" fill="#7B1E23" />
  <circle cx="48" cy="48" r="42" fill="url(#gold)" />
  <circle cx="48" cy="48" r="38.5" fill="none" stroke="#7B1E23" stroke-width="1.5" />
  <circle cx="48" cy="48" r="35" fill="#FBF6E7" />

  <!-- Gopuram: temple tower silhouette -->
  <g fill="#5C0510">
    <path d="M48 17.5 46.2 22h3.6z" />
    <path d="M40.5 23.5h15l1.6 4.5H38.9z" />
    <path d="M38 29.5h20l1.9 5.2H36.1z" />
    <path d="M35 36.2h26l2.2 5.6H32.8z" />
    <path d="M31.6 43.3h32.8l2.4 6H29.2z" />
    <path d="M27.8 51h40.4l2.6 6.4H25.2z" />
    <rect x="23.6" y="58.9" width="48.8" height="4.4" rx="0.6" />
    <!-- Sanctum doorway -->
    <path d="M43.4 63.3h9.2v9.4h-9.2z" opacity="0.95" />
  </g>

  <!-- Doorway cut-out -->
  <path d="M45.2 65.1h5.6v7.6h-5.6z" fill="#FBF6E7" />

  <!-- Plinth -->
  <rect x="21" y="72.7" width="54" height="3.4" rx="0.8" fill="#7B1E23" />

