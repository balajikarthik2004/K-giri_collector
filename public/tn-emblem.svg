  <g stroke="#7B1E23" stroke-width="1.4" stroke-linecap="round" opacity="0.75">
    <path d="M48 6.5v3.4M48 86.1v3.4M6.5 48h3.4M86.1 48h3.4" />
    <path d="M18.7 18.7l2.4 2.4M74.9 74.9l2.4 2.4M77.3 18.7l-2.4 2.4M21.1 74.9l-2.4 2.4" />
